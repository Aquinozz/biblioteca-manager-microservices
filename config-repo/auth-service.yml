server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/authdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: biblioteca
    password: biblioteca123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /auth-api-docs
  server:
    url: http://localhost:8080

jwt:
  secret: MinhaChaveSuperSecretaComPeloMenos32Caracteres
  expiration: 86400000
